apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 0
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          # Include all args in overlay patch for consistency
          args:
            - "Qwen/Qwen3-VL-32B-Instruct"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=2"
            - "--mm-processor-cache-gb"
            - "20"
            - "--block-size=64"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@Qwen/Qwen3-VL-32B-Instruct"}'

            # Uncomment for distributed tracing
            # - "--otlp-traces-endpoint=http://otel-collector:4317"
            # - "--collect-detailed-traces=all"
          ports:
            # Exposed so each router replica can dial the per-pod ZMQ
            # socket bound by vLLM (KV_EVENTS_ENDPOINT=tcp://*:5556).
            - containerPort: 5556
              name: kv-events
              protocol: TCP

          env:
          - name: KV_EVENTS_ENDPOINT
            value: "tcp://*:5556"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_PORT
            value: "8000"
          #   # Uncomment for distributed tracing env vars
          #   - name: OTEL_SERVICE_NAME
          #     value: "vllm-decode"
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: "http://otel-collector:4317"
          #   - name: OTEL_TRACES_EXPORTER
          #     value: "otlp"
          #   - name: OTEL_TRACES_SAMPLER
          #     value: "parentbased_traceidratio"
          #   - name: OTEL_TRACES_SAMPLER_ARG
          #     value: "0.1"
          resources:
            limits:
              cpu: '16'
              memory: 256Gi
              nvidia.com/gpu: 2
            requests:
              cpu: '8'
              memory: 128Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: vllm-config
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
